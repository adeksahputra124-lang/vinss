!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VINSZZ Music</title>

<style>
body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

.logo span{
    color:#1ed760;
}

.song{
    background:#181818;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
}

.song:hover{
    background:#282828;
}

.player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#181818;
    padding:15px;
    text-align:center;
}

button{
    border:0;
    border-radius:30px;
    padding:12px 25px;
    font-weight:bold;
    cursor:pointer;
}

.play{
    background:#1ed760;
}

audio{
    width:100%;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo">
        VINSZZ<span>●</span>
    </div>

    <h2>🎵 Playlist</h2>

    <div
        class="song"
        onclick="playSong('music/lagu1.mp3','Lagu Pertama')"
    >
        🎵 Lagu Pertama
    </div>

    <div
        class="song"
        onclick="playSong('music/lagu2.mp3','Lagu Kedua')"
    >
        🎵 Lagu Kedua
    </div>

    <div
        class="song"
        onclick="playSong('music/lagu3.mp3','Lagu Ketiga')"
    >
        🎵 Lagu Ketiga
    </div>

</div>


<div class="player">

    <div id="title">
        Belum ada lagu
    </div>

    <br>

    <audio
        id="audio"
        controls
    ></audio>

    <br><br>

    <button
        class="play"
        onclick="togglePlay()"
        id="playButton"
    >
        ▶ Play
    </button>

</div>


<script>

const audio =
    document.getElementById("audio");

const title =
    document.getElementById("title");

const playButton =
    document.getElementById("playButton");


function playSong(file, name){

    audio.src = file;

    title.textContent = name;

    audio.play();

    playButton.textContent =
        "⏸ Pause";
}


function togglePlay(){

    if(!audio.src){

        alert("Pilih lagu terlebih dahulu!");

        return;
    }

    if(audio.paused){

        audio.play();

        playButton.textContent =
            "⏸ Pause";

    }else{

        audio.pause();

        playButton.textContent =
            "▶ Play";
    }
}


audio.addEventListener(
    "ended",
    function(){

        playButton.textContent =
            "▶ Play";

    }
);

</script>

</body>
</html>
